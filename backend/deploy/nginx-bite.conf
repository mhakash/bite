# Reference copy of the nginx vhost for engine.mhakash.com (the backend's
# public domain), installed in /etc/nginx/sites-enabled/ on the droplet.
# Not applied automatically — proxies to bite.service on 127.0.0.1:8080.
server {
    listen 80;
    listen [::]:80;
    server_name engine.mhakash.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name engine.mhakash.com;

    ssl_certificate     /etc/nginx/ssl/engine.mhakash.com/engine.mhakash.com.pem;
    ssl_certificate_key /etc/nginx/ssl/engine.mhakash.com/engine.mhakash.com.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
